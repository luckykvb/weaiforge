version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/prod
      - /infra/modules/static-site
    schedule:
      interval: weekly

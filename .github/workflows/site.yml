name: Site

# Build + verify the static site on every PR and push; deploy to S3 + CloudFront
# on push to main (and on demand). No long-lived AWS keys: the deploy job
# assumes an OIDC role scoped to the one bucket and distribution.

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "*.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "infra/modules/static-site/functions/**"
      - "infra/scripts/check-csp.mjs"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or ref to build and deploy (rollback)."
        required: false
        default: ""

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build · test · scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Unit-test the CloudFront Functions
        run: node --test "infra/modules/static-site/functions/*.test.mjs"
      - run: npm run build
      - name: Check the build against the edge CSP
        run: node infra/scripts/check-csp.mjs dist
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.event.inputs.ref || github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  secrets-scan:
    name: Secrets · gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (commits in this change)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="$range"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  deploy:
    name: Deploy to S3 + CloudFront
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, secrets-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.event.inputs.ref || github.sha }}
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-site-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync fingerprinted assets (immutable, cached a year)
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --no-progress --exclude "*" --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Sync HTML and the rest (revalidated, delete removed objects)
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --no-progress --delete --exclude "assets/*" \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --id "$id"

  smoke:
    name: Smoke test
    needs: deploy
    if: vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe pages, redirects and security headers
        run: bash infra/scripts/smoke.sh "${{ vars.SITE_URL }}"

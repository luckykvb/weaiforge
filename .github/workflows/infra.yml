name: Infrastructure

# Terraform for the website stack (infra/envs/prod). The bootstrap stack is
# human-applied once (RUNBOOK) and only validated here.
#   pull_request → static checks + plan (read-only role), posted as a PR comment
#   push to main → static checks + plan + apply (apply role, "production" env)
#   weekly       → drift detection

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACK_DIR: infra/envs/prod

jobs:
  static:
    name: fmt · validate · tflint · checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        run: |
          for stack in bootstrap envs/prod; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          for stack in bootstrap envs/prod; do
            tflint --chdir "$stack" --config "$PWD/.tflint.hcl" --format compact
          done
      - name: tag-contract checker self-test
        run: python3 -I scripts/check-tags.py --self-test
      - name: checkov
        run: pipx run "checkov==${CHECKOV_VERSION}" -d . --framework terraform --quiet --compact --skip-download

  plan:
    name: Plan (prod)
    needs: static
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-tf-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        working-directory: ${{ env.STACK_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform plan
        id: plan
        working-directory: ${{ env.STACK_DIR }}
        run: |
          set +e
          terraform plan -var-file=prod.tfvars -lock-timeout=5m -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]
      - name: Enforce mandatory tags on every planned resource
        if: steps.plan.outputs.exitcode == '2'
        working-directory: ${{ env.STACK_DIR }}
        run: |
          terraform show -json tfplan > plan.json
          python3 -I ../../scripts/check-tags.py plan.json
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ env.STACK_DIR }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-prod -->';
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = '…(truncated, see the job log)…\n' + plan.slice(-max);
            const summary = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['see log'])[0];
            const body = `${marker}\n#### Terraform plan · prod · \`${summary}\`\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>\n\n_Run ${context.runId} · ${context.sha.slice(0, 7)}_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Drift detected
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Live infrastructure has drifted from main. Review the plan above."
          exit 1

  apply:
    name: Apply (prod)
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-tf-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        working-directory: ${{ env.STACK_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      # Re-plan under the apply role and apply exactly that plan.
      - name: terraform plan
        working-directory: ${{ env.STACK_DIR }}
        run: terraform plan -var-file=prod.tfvars -lock-timeout=5m -no-color -out=tfplan
      - name: terraform apply
        working-directory: ${{ env.STACK_DIR }}
        run: terraform apply -lock-timeout=5m -no-color tfplan
      - name: Outputs
        working-directory: ${{ env.STACK_DIR }}
        run: |
          {
            echo "### Prod stack outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

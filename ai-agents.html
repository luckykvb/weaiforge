          "name": "What is the difference between an AI agent and a chatbot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A chatbot answers questions. An agent takes action: it reads from your systems, decides what to do within rules you set, and does it, such as drafting a reply, updating a record or routing a case. We build both, and many projects start as a chatbot and grow into an agent."
          }

          "@type": "Question",
          "name": "Can an agent work with the tools we already use?",
          "acceptedAnswer": {
            "@type": "Answer",

          }

          "@type": "Question",
          "name": "How do you keep an agent from making costly mistakes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Guardrails are designed before any code is written. Typical controls include limited permissions, human approval for sensitive actions, full logging of what the agent did and why, and a clear hand-off to a person when it is unsure. We test against your real cases before it goes live."
          }
        },
        {
          "@type": "Question",
          "name": "Who owns the system you build?",

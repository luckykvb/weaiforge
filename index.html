    <script>
      // Restore the explicit choice, otherwise follow the system before paint.
      (function () {
        var root = document.documentElement;
        var theme, preference;
        try {
          theme = localStorage.getItem('weaiforge-theme');
          preference = localStorage.getItem('weaiforge-mode');
        } catch (e) {}
        if (['slate', 'forest', 'amber'].indexOf(theme) !== -1) root.setAttribute('data-theme', theme);
        if (preference !== 'light' && preference !== 'dark') preference = 'system';
        var mode = preference === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        root.setAttribute('data-mode', mode);
        root.setAttribute('data-mode-preference', preference);
      })();
    </script>
